# GrooveStats Options
EnableGrooveStats=Establish a connection to GrooveStats.
AutoDownloadUnlocks=Auto-Download Unlocks for Online Events.\n\nNote: Unzipping the unlock can cause the game to stutter.
SeparateUnlocksByPlayer=Separate Downloaded Unlocks for Each Profile.
QRLogin=When to display that QR Login screen.\n\nAlways - Always display the QR Login screen.\n\nSometimes - Only display the QR Login screen if needed for the profiles.\n\nDisable QR Login entirely.
EnableArrowCloud=Enable the third-party Arrow Cloud score module.\n\nWhen enabled, the theme can link an Arrow Cloud account, submit eligible post-song scores, and communicate with api.arrowcloud.dance.
ArrowCloudDebugLogs=Write detailed Arrow Cloud request, login, and leaderboard traces to log.txt.\n\nLeave disabled unless debugging account/link/scoreboard issues.
MusicWheelGS=Select how to display GrooveStats / ArrowCloud scores on the song select screen.\n\nScorebox displays a small leaderboard. Pane uses the lower song pane display when available. Off hides this display.
HideGrooveStats=Hide GrooveStats leaderboards from the scorebox rotation.\n\nArrowCloud leaderboards will still be shown.

