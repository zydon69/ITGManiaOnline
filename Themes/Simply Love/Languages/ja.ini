LogOptions=パフォーマンス、レンダリング、オーディオ、キャッシュ診断のサポートログを有効にします。
ShowPopups=エンジンのダイアログを表示するか、ログにのみ記録するかを選びます。アーケード筐体では、フルスクリーン解除を避けるためログのみを使用してください。
ArrowCloudOptions=Arrow Cloud 連携の設定を管理します。
OnlineOptions=ITG online mode settings.
OnlineTokenPersistence=Choose whether this local profile should always show the QR login screen, or keep its ITG Online sign-in token for later sessions.
ITGOnlineGameplayLayoutLogs=Enable verbose logs for online gameplay layout calculations, including columns, panel widths, and leaderboard size. Leave this disabled unless you are debugging screen layout.
ITGOnlineNetworkLogs=プロトコル、ルーム、リアルタイム通信、パック同期の制限付き診断を有効にします。機密情報はマスクされます。
ITGOnlineAuthLogs=ログインと認証情報の制限付き診断を有効にします。トークンは記録されません。
ITGOnlineScoreLogs=ライブスコア、失敗、評価同期の制限付き診断を有効にします。
DissociateOnlineAccount=Unlink the selected local profile from its ITG Online account. The saved sign-in token is revoked and the player will need to scan a QR code again.
SoundDriver=Windows のオーディオバックエンドを選びます。まず WASAPI を推奨します。互換性のために DirectSound-sw、WaveOut、WDMKS も利用できます。\n\n変更を反映するには SM5 の再起動が必要です。
LogToDisk=Logs フォルダーに Log.txt、info.txt、ユーザー向けログファイルを書き込みます。\n\nサポートログを収集する際は有効のままにしてください。
ShowLogOutput=利用可能な場合、プラットフォームのログコンソール/ウィンドウにログ出力を表示します。
ForceLogFlush=ログの書き込みを即座にフラッシュします。\n\nクラッシュやフリーズを再現する際に有効にします。追加のディスク I/O が発生します。
LogSkips=フレームスキップのタイミングログを書き込みます。\n\nゲームプレイが目に見えてカクつく、タイミングが不安定に感じるときに使用します。
LogCheckpoints=エンジンのチェックポイントログを書き込みます。\n\n起動、画面遷移、終了時の問題に使用します。
PerfDiagnostics=マスタースイッチ：以下のすべての診断カテゴリを有効にし、フレームペーシング、ゲームプレイの描画コスト、遅いエンジンフェーズの詳細な PERF_TRACE も記録します。\n\n問題を報告する際にすべてを一度に取得するのに使用します。より静かで的を絞ったログには、下の単一カテゴリを有効にしてください。
LogAudioUnderrunDiagnostics=オーディオの枯渇とデコードの停滞について詳細な UNDERRUN_TRACE を記録します。\n\n音が途切れる、ノイズが入る、ズレるときに使用します。
LogTextureUploadDiagnostics=OpenGL のテクスチャアップロードの詳細を記録します。\n\nグラフィックが欠ける、壊れる、テクスチャ読み込み時にカクつくときに使用します。
LogResourceSnapshotDiagnostics=画面遷移時にテクスチャ/リソースのスナップショットを記録します。\n\nメモリの増加やテクスチャリークの疑いを追跡するときに使用します。
LogBackgroundDiagnostics=曲背景、BGChange、背景動画、遅い背景読み込みについて BGA_TRACE を記録します。\n\n背景動画が固まる、カクつく、正しく表示されないときに使用します。
LogPlayOnceDiagnostics=効果音キャッシュの統計を記録し、Lua からの手動 PlayOnce 診断を許可します。\n\n短い効果音が出ない、遅れる、メモリ使用量が増えるときに使用します。
LogNoteSkinDiagnostics=NoteSkin アクターキャッシュの統計を記録します。\n\nNoteSkin の読み込みが遅い、表示がおかしい、メモリリークが疑われるときに使用します。
LogInputDiagnostics=デバイスからゲームへのマッピング後、デバウンス済みの入力イベントを記録します。\n\nパッド、ボタン、コイン、メニュー入力が抜ける、重複する、誤ってマッピングされるときに使用します。
LogMemoryCardDiagnostics=USB プロファイルとメモリーカードの割り当て、マウント、アンマウントのトレースを記録します。\n\nUSB プロファイルが検出されない、誤った側に割り当てられる、保存/読み込みで失敗するときに使用します。
LogContentLoadDiagnostics=曲、コース、ノーツ、歌詞、オーディオリーダーの読み込みトレースを記録します。\n\nコンテンツの読み込みが遅い、欠ける、拒否される、特定のパックでのみ失敗するときに使用します。
LogThemeLuaDiagnostics=テーマの Lua スクリプト読み込みトレースを記録します。\n\n起動、リロード、画面遷移時にテーマが失敗するときに使用します。
LogGlobalOffsetDiagnostics=名前付きグローバルオフセットプロファイル、オプション行、キャリブレーション、Autosync、タイミング変換の詳細トレースを記録します。\n\nオーディオオフセットのデバッグ時のみ有効にしてください。
LogWindowsEventDiagnostics=Win32ウィンドウの低レベルイベントを記録します。\n\nWindowsのフォーカス、サイズ変更、ネイティブ入力を調査するときだけ有効にしてください。数千行のログが生成される場合があります。
runtime_validation=強化されたコード経路の診断ログを記録します。\n\n特定の問題を調査するとき以外は無効のままにしてください。
EnableArrowCloud=サードパーティの Arrow Cloud スコアモジュールを有効にします。\n\n有効にすると、テーマは Arrow Cloud アカウントを連携し、対象となる曲後スコアを送信し、api.arrowcloud.dance と通信できます。
ArrowCloudDebugLogs=Arrow Cloud のリクエスト、ログイン、リーダーボードの詳細トレースを log.txt に記録します。\n\nアカウント/連携/スコアボードの問題をデバッグする場合を除き、無効のままにしてください。
MusicWheelGS=選曲画面での GrooveStats / ArrowCloud スコアの表示方法を選びます。\n\nScorebox は小さなリーダーボードを表示します。Pane は利用可能な場合に下部の曲ペインを使用します。Off はこの表示を隠します。
HideGrooveStats=GrooveStats のリーダーボードを Scorebox のローテーションから隠します。\n\nArrowCloud のリーダーボードは引き続き表示されます。
ExScoreMode=ゲームプレイ中に表示する EX スコアモードを選びます。EX と H.EX は排他的です。
ShowAllScoreModes=Show lower score modes next to the main gameplay score.
MatchFantasticColor=選択したスコアモードの有効な判定幅に合わせて Fantastic の色を変えます。
ResetLogs=log.txt の内容をすべて消去し、クリーンな状態からログを開始します。\n\n「今すぐリセット」を選び、この画面を離れると適用されます。

DefaultSort=Set the default sort order for songs in the MusicWheel.\nBy default, this is set to "Series" which groups songs into Series and Groups.
HideInactiveSeries='Yes'に設定すると、選曲画面において、現在のゲームモードでプレイできないシリーズが表示されなくなります。\n\nこのオプションは、プレイヤーがプロファイル（ローカルまたはUSB）を使用している場合のみ有効です。
PreferredStyle=このオプションを使うと、スタイル選択画面をスキップすることができます。ゲームプレイをすばやく始めたい場合に有効です。\n\nゲームプレイ毎にスタイルを選択したい場合は、このオプションは'None'にしておきましょう。
