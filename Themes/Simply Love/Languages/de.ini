# Top-level Service menu items
SystemOptions=Ändere den Spieltyp, das Thema, die Sprache und noch mehr.
Key Joy Mappings=Belege Tasten und Joystick-Knöpfe mit Spielfunktionen.
Arcade Options=Ändere die Optionen für typische Arcade-Spiele.
VisualOptions=Ändere die Art und Weise, wie Texte, Hintergründe usw. während des Spiels angezeigt werden. Overscan ändern.
AppearanceOptions=Ändere die Art und Weise, wie Dinge während des Spiels angezeigt werden (Texte, Hintergründe usw.).
ThemeOptions=Ändere die Einstellungen, die nur für dieses Simply Love-Thema gelten
USBProfileOptions=Ändere die Einstellungen für USB-Lieder, einschließlich der Aktivierung oder Deaktivierung der Funktion insgesamt.
MenuTimerOptions=Schalte den Menü-Timer ein oder aus und stelle die MenuTimer-Werte für verschiedene Bildschirme ein.
InArcadeOptionsdere die Eingabeoptionen an, z. B. automatische Joystick-Belegung, dedizierte Menütasten und Eingabeentprellung.
Profiles=Erstelle, bearbeite und verwalte die auf diesem Computer gespeicherten Spielerprofile.\n\nFür diesen Bildschirm wird eine Tastatur benötigt.\n\nUm ein Profilbild hinzuzufügen, lege eine Bitmap-Datei im Profilordner ab und nenne sie `avatar.png`.\nDu kannst auch `profile picture.png`, `profile picture.jpg`, `profile picture.jpeg`, `profile picture.bmp` oder `profile picture.gif` verwenden.\nWenn dort keine Datei gefunden wird, prüft das Spiel auch `/Appearance/Avatars/<Anzeigename>.*`.
AcknowledgmentsMenu=Danksagungen und Credits für Simply Love, StepMania und mehr anzeigen.
Clear Credits=Credits auf 0 zurücksetzen.
GrooveStatsOptions=Verwalten Sie die GrooveStats -Einstellungen.



# SystemOptions
Game=Ändere den aktuellen Spieltyp.\n\n• dance ist 4-Panel (DDR und ITG).\n• pump ist 5-Panel (Pump It Up).\n• techno ist 8-Panel (TechnoMotion).
Theme=Ändern das Aussehen und Gefühl von StepMania. \n\nThemen erweitern die Basisfunktionalität von SM5 häufig auf einzigartige Weise
Language=Wähle deine Sprache.\nSimply Love unterstützt:\n	• Deutsch\n	• English\n	• Español\n	• Français\n	• Italiano\n	• 日本語\n	• Polski\n	• Português Brasileiro (pt-br)\n	• Русский\nAndere Sprachen werden in Simply Love nur wenig unterstützt, in anderen Themen jedoch möglicherweise besser.
Announcer=Wähle aus dieser Liste der installierten Pakete einen Gameplay-Ansager aus.
DefaultNoteSkin=Wähle den Standardnotenskin, der beim Spielen verwendet werden soll.\n\nDiese Einstellung kann von den Spielern vor dem Spielen im Menü "Player Options" geändert werden.
EditorNoteSkin=Wähle den Standardnotenskin für den Bearbeitungsmodus.


# Visual Options
Set BG Fit Mode=Passen an wie StepMania während des Spiels Hintergründe anzeigt (Skalieren, Zuschneiden usw.)


#GraphicsSoundOptions
Windowed=Wähle zwischen dem Vollbildmodus des Spiels und einem normalen Desktop-Fenster.\n\nUnter macOS ist der Vollbildmodus des Spiels nicht dasselbe wie der System-Vollbildmodus über den grünen Fensterknopf. Für die stabilste Nutzung empfehlen wir, Fenster zu wählen und den grünen macOS-Knopf zu verwenden, wenn das Spiel den Bildschirm füllen soll.
SmoothLines=Toggle whether certain theme components are rendered with antialiased lines.\n\nSpecifically, any theme or simfile that utilizes an ActorMultiVertex in 'LineStrip' mode will be impacted by this setting.
FastNoteRendering=If enabled, the z buffer is not cleared after every note.  This causes 3D noteskins to collide, but substantially improves performance in gameplay.
VisualDelaySeconds=Subtract or add this many milliseconds of visual delay to gameplay.\n\nNegative values can be used to compensate for an LCD TV with a lot of "lag" or latency.


# Appearance Options
ShowLyrics=Toggle the display of song lyrics during gameplay if they are available.\n\nLyrics can be provided on a per-song basis by using a .lrc file.
ShowBanners=Toggle the display of song banners during Select Music if they are available.
BGBrightness=Control how bright the background will appear during gameplay.\n\nLower values result in a darker background.  0% is completely black.
RandomBackgroundMode=• Off - Display the background specified by the song and nothing more.\n\n• Random Animations – Show randomly selected items from the BGAnimations folder during gameplay.\n\n• Random Movies - Show randomly selected items in the RandomMovies folder during gameplay.
RandomBackgroundMode=• Off - Display the background(s) specified by the current song.\n\n• Random Animations – Show randomly selected items from the BGAnimations folder during gameplay.\n\n• Random Movies - Show randomly selected items in the RandomMovies folder during gameplay.
NumBackgrounds=Choose the number of random backgrounds that will cycle per song.\n\nIf Random Gameplay Backgrounds is 'Off', this has no effect.
Center1Player=Turn this option 'On' to center the notefield during gameplay when only one player is active.
ShowDancingCharacters=If you have dancing characters installed, players can choose one from the second PlayerOptions menu in Simply Love.\n\nOther themes may use the "Select" choice to show a Character Select screen, but Simply Love does not.\n\nIf you do not have dancing characters installed, this setting will have no impact in any theme.


# Arcade Options
CoinMode=• Home - Options are shown on the Title screen.\n\n• Pay - Title screen choices are hidden; players must insert credits before playing. Pay mode is only possible when Event Mode is "Off."\n\n• Free Play - Title screen choices are hidden; no credits required to play.
CoinsPerCredit=This determines how many coins are necessary for a single credit.
MaxNumCredits=Geben Sie die maximal zulässige Anzahl an Credits an.\n\nDiese Einstellung gilt nur, wenn der Münzmodus auf „Bezahlen“ eingestellt ist.
Long Time=This is the length at which a song counts as two rounds.\n\nSet this to 'Off' if you don't want any songs to count as two rounds.
Marathon Time=This is the length at which a song counts as three rounds.\n\nIf Songs Per Play is set to 2, any song that counts as three rounds will not appear as a choice.\n\nSet this to 'Off' if you don't want any songs to count as three rounds.
AllowMultipleHighScoreWithSameName=Set this to 'Off' to prevent a single player from dominating the high score list for a given song.  Each chart will only allow one of a given high score handle.\n\nSet this to 'On' if you own your machine and wish to track your own progress.
ComboContinuesBetweenSongs=If turned off, the combo will reset to 0 between each song.\n\nIf turned on, the combo will carry between songs (and between unique games if profiles are not in use, which is typically the case...).
Disqualification=If turned off, players cannot be disqualified from earning high scores.\n\nIf enabled, certain conditions (C-Mods on charts with speed changes, disabling attacks on charts with attacks, etc.) will disqualify players from earning high scores.
Premium=This setting only applies when Coin Mode is set to 'Pay'.\n\n• 'Off' means one player can play with one credit\n\nThe remaining two options are surprisingly self-explanatory.


# Input Options
OnlyDedicatedMenuButtons=• Use Gameplay Buttons - Navigate through the game using your dance pad.\n\n• Only Dedicated Buttons - Navigate through the game using dedicated menu buttons, presumably on an arcade cabinet.\n\nPlease ensure your menu buttons are mapped before changing this setting, otherwise you might get stuck.
ThreeKeyNavigation=Enable this if you only have three MenuButtons per player (e.g. a traditional DDR arcade cabinet).  Some UI elements will change to reflect this.\n\nWith this enabled, you can save screenshots in Simply Love at Evaluation by simultaneously pressing &MENULEFT; and &MENURIGHT;.
ArcadeOptionsNavigation=This impacts how option menus are navigated.\n\n• StepMania Style - &START; button moves to end.\n\n• Arcade Style - &START; button moves to next option line.
InputDebounceTime=Time that a panel takes to de-press.  Use this to deal with ghost steps that occur a few milliseconds after a real step.
AxisFix=Workaround fix for some USB adapters that would otherwise map the D-Pad to Axis, preventing certain jump combinations from being possible.\n\nThis does not work on macOS or Linux's JS driver yet.
#'


# Simply Love Options
AutoStyle=Set this if you ALWAYS play a certain style and want to get to gameplay as fast as possible.\n\nSet this to "None" if you want to choose a style like "1 Player" or "2 Players" for each new game cycle.
DefaultGameMode=Set the starting position of the cursor when selecting a GameMode.\n\nNote that this does not skip the screen, it just changes the starting choice.
AllowFailingOutOfSet=If 'Yes' players can potentially fail out of a set early.  If 'No' players will always be able to play all their songs.\n\nThis has no impact in EventMode.
NumberOfContinuesAllowed=Allow players to chain multiple games together by entering extra credits. Set this to 0 if you want to disable it.
MusicWheelSpeed=Change the speed at which the MusicWheel will scroll through content.\n\nA faster MusicWheel is especially helpful when the MenuTimer is enabled.


AllowScreenSelectProfile=Setzen Sie diese Option auf „Nein“, wenn Sie den Bildschirm „Profil auswählen“ überspringen und den Profilwechsel über das Optionsmenü im Bildschirm „Musik auswählen“ deaktivieren möchten.\n\nDer Bildschirm Profil auswählen kann hilfreich sein, wenn Sie mehrere lokale Profile haben.
AllowScreenSelectColor=Set this to 'No' if you want to skip the Select Color screen.\n\nNote that Rainbow Mode disables the Select Color screen by default.
AllowScreenSelectOnlineMode=Set this to 'No' if you want to skip the Local / Online screen and always play locally.
AllowScreenEvalSummary=Set this to 'No' if you want to skip the Evaluation Summary screen.
AllowScreenNameEntry=Set this to 'No' if you want to skip the Name Entry screen.\n\nThe Name Entry screen is always skipped in Casual mode, regardless of this setting.
AllowScreenGameOver=Set this to 'No' if you want to skip the Game Over screen.


MusicWheelStyle=Set this to 'IIDX' if you want the MusicWheel to hide other, inactive song groups when actively browsing one.
AllowDanceSolo=Set this to 'Yes' if you want to enable Solo as a selectable option so you can play the handful of 6-panel charts in:\n\n• Solo Bass Mix\n• Solo 2000\n• Solo 4th Mix\n• foonmix\n• Solo Doubles 🤫\n\nThis only impacts 'Dance' game mode.
HideStockNoteSkins=Set this to 'Hide' if you want to hide all NoteSkins that come with SM5 from the modifier menu.


nice=Diese Einstellung sucht nach der Nummer “69” auf dem Evaluierungs-Bildschirm und zeigt dass sie “nice” sind 👌




ShowGradesInMusicWheel=Show or hide letter grades for each song you've played within the MusicWheel.\n\nPlease note that you'll need to be using a profile (local or USB) for this to work.
CasualMaxMeter=Charts harder than this will be filtered out of Casual Mode.
VisualStyle=Choose the visual icon/emblem for this theme.\n\nEach visual style within Simply Love has unique graphics and background music.
AllowThemeVideos=Ob Videos auf Themenbildschirmen angezeigt werden sollen, die sich möglicherweise auf das Gameplay auswirken könnten.
RainbowMode=Regenbogen-Modus ein oder ausschalten.\n\nRegenbogen-Modus deaktiviert standardmäßig ScreenSelectColor.
WriteCustomScores=Diese Einstellung aktiviert die Speicherung von erweiterten Ergebnis-Dateien. Sie werden in deinem Profilordner abgelegt. Für Gastnutzer werden keine Ergebnisse gespeichert.\n\nDie Ergebnis-Dateien können auf der simply.training Webseite hochgeladen werden um deinen Fortschritt zu verfolgen.
UseImageCache=Casual Mode will run more smoothly with the ImageCache system on, but StepMania will use a LOT more RAM as a consequence. It is recommended that you have at least 8GB of RAM to use the ImageCache system.\n\nYou will need to restart StepMania after turning this setting on for it to take effect.


# USB Profile CustomSongs Options
CustomSongsEnable=Allow custom songs to be loaded from USB profiles.\n\nNote that you must properly configure your OS to mount and recognize USB memory cards first for this to work.\n\nConsult the Wiki on StepMania's GitHub for Linux instructions or hackmycab.com for Windows instructions.
#'
CustomSongsMaxCount=Use this to limit the number of songs that will be loaded from a given USB profile.
CustomSongsLoadTimeout=If loading a song from a USB takes more seconds than this, cancel it and make the player choose a different song.
CustomSongsMaxSeconds=If a song from a USB profile is longer than this many many minutes and seconds, it will not appear as a selectable song.
CustomSongsMaxMegabytes=If a song from a USB profile is larger than this file size, it will not appear as a selectable song.


# MenuTimer Options
MenuTimer=When 'On', certain screens have a time limit, which you can set below.\n\nWhen 'Off', these values are ignored, and you may spend as much time on each screen as you need.
ScreenSelectMusicMenuTimer=Set the MenuTimer value for ScreenSelectMusic.
ScreenSelectMusicCasualMenuTimer=Set the MenuTimer value for ScreenSelectMusic when in 'Casual' mode.
ScreenPlayerOptionsMenuTimer=Set the MenuTimer value for ScreenPlayerOptions.
ScreenEvaluationMenuTimer=Set the MenuTimer value for ScreenEvaluation.
ScreenEvaluationSummaryMenuTimer=Set the MenuTimer value for ScreenEvaluationSummary.
ScreenNameEntryMenuTimer=Set the MenuTimer value for ScreenNameEntry.


# Advanced Options
DefaultFailType=• Immediate - Ends gameplay when all players run out of life.\n\n• ImmediateContinue - Fails players when they run out of life, but allows gameplay to continue.\n\n• Off - Disables fail.
UseUnlockSystem=Enable or disable StepMania's unlock system.\n\nSimply Love does not support the unlock system, and I don't know of any other theme that does.
AllowExtraStage=When enabled (and Event Mode is off), this allows players to earn extra stages after completing certain requirements.\n\nThis presumably impacts other themes, but has no bearing on Simply Love.
HiddenSongs=Simfiles with #SELECTABLE:NO; will not appear in the MusicWheel, but might be accessible via specific courses.\n\nLeave this 'Off' to always display all songs.
EasterEggs=Enable or disable some secret surprises a theme author may or may not have embedded in the theme.


# Acknowledgments Menu
StepMania Credits=Feiere die Leute, die StepMania möglich gemacht haben.

# GrooveStats Options
EnableGrooveStats=Stellen Sie eine Verbindung zu GrooveStats her.
AutoDownloadUnlocks=Auto-Download-Entsperren für Online-Events.\n\nHinweis: Das Entpacken der Entsperrung kann dazu führen, dass das Spiel stottert.
SeparateUnlocksByPlayer=Separate heruntergeladene Entsperren für jedes Profil.

# ScreenPlayerOptions
SpeedModType=Ändern wie Pfeile auf sich ändernde BPMs reagieren.
SpeedMod=Ändere wie schnell die Pfeile nach hochkommen.
Mini=Ändere die Größe deiner Pfeile.
Perspective=Ändern die Perspektive der Pfeile.
NoteSkin=Ändern das Aussehen der Pfeile.
JudgmentGraphic=Wähl deinen judgment Schriftart.
ComboFont=Wähl die Schriftart für Combo. Diese Schriftart wird auch für den Measure Counter verwended, wenn es aktiviert ist.
BackgroundFilter=Verstecke die Unterseite des Spielfeld.
NoteFieldOffsetX=Passen Sie die horizontale Position des Notizfelds an (relativ zur Mitte).
NoteFieldOffsetY=Passen Sie die vertikale Position des Notizfelds an.
MusicRate=Ändern die Tempo der Musik.
Stepchart=Wähle ein Schwierigkeit.
FaPlus=Wähle, ob du das FA+-Fenster emulieren und/oder die EX-Wertung im Spiel anzeigen möchten.
ScreenAfterPlayerOptions=Wähl ein anderes Lied ODER wähl mehrere Modifikationen.


# ScreenPlayerOptions2
Accel=Beschleunigungs stile. [m]
Effect=Verschiedene Pfeileffekte. [m]
Appearance=Kontrollieren die Sichtbarkeit der Pfeile. [m]
Turn=Ändern die Notizen des Stepcharts. [m]
#'
Insert=Mehr Noten einfügen. [m]
Scroll=Ändern wie Pfeile scrollen. [m]
Holds=Halter ändern. [m]
Mines=Minen ändern.
Attacks=Schalten skriptbasierte Angriffe ein oder aus.\n"Zufällige Angriffe" wenden während des Spiels Modifikationen nach dem Zufallsprinzip an.
PlayerAutoPlay=Umschalten AutoPlay.
Hide=Verstecke verschiedene Spielelemente. [m]
Persp=Ändern die Notizfeldperspektive.
Remove=Noten entfernen [m].
RemoveA=Noten entfernen [m].
RemoveB=Noten entfernen [m].
DataVisualizations=Show the pacemaker graph or step statistics\non the side of the playfield.
TargetScore=Choose the Target Score for your pacemaker.
ActionOnMissedTarget=Choose the action that should be performed when your Target Score is no longer achievable.
GameplayExtras=Toggle advanced gameplay helpers and statistics.
GameplayExtrasB=Toggle advanced gameplay helpers and statistics.
GameplayExtrasC=Toggle advanced gameplay helpers and statistics.
MeasureCounterOptions=Use these to change how the Measure Counter displays. It is centered and below the Judgment graphic by default.
MeasureCounter=Display a count of how long you have been streaming\na specific type of note.
ScreenAfterPlayerOptions2=Go back and choose a different song or change additional modifiers.
LifeMeterType="Surround" positions the LifeMeter vertically behind the\nplayfield. "Vertical" positions it vertically beside the playfield.


# ScreenPlayerOptions3
ScreenAfterPlayerOptions3=Go back and choose a different song or change additional modifiers.


# Screen Profiles
Select Profile=Dieses Profil verwenden oder es ändern.




##############################################
LogOptions=Support-Protokolle für Leistung, Rendering, Audio und Cache-Diagnose aktivieren.
ShowPopups=Legt fest, ob Engine-Dialogfenster erlaubt sind oder nur ins Protokoll geschrieben werden. Auf Arcade-Cabs sollte nur protokolliert werden, damit der Vollbildmodus nicht verlassen wird.
ArrowCloudOptions=Arrow Cloud-Integrationseinstellungen verwalten.
OnlineOptions=Online-Modus-Einstellungen verwalten.
OnlineTokenPersistence=Choose whether this local profile should always show the QR login screen, or keep its ITG Online sign-in token for later sessions.
ITGOnlineGameplayLayoutLogs=Enable verbose logs for online gameplay layout calculations, including columns, panel widths, and leaderboard size. Leave this disabled unless you are debugging screen layout.
ITGOnlineNetworkLogs=Aktiviert begrenzte Diagnosen für Protokoll, Räume, Echtzeit und Paket-Synchronisierung. Vertrauliche Werte werden maskiert.
ITGOnlineAuthLogs=Aktiviert begrenzte Diagnoseprotokolle für Anmeldung und Zugangsdaten. Token werden nie protokolliert.
ITGOnlineScoreLogs=Aktiviert begrenzte Diagnosen für Live-Punkte, Fehler und Auswertung.
DissociateOnlineAccount=Trennt das ausgewählte lokale Profil vom ITG Online-Konto. Das gespeicherte Anmelde-Token wird widerrufen und der Spieler muss beim nächsten Mal wieder einen QR-Code scannen.
SoundDriver=Wähle das Windows-Audio-Backend. WASAPI wird zuerst empfohlen; DirectSound-sw, WaveOut und WDMKS sind zur Kompatibilität verfügbar.\n\nDu musst SM5 neu starten, damit eine Änderung wirksam wird.
LogToDisk=Log.txt, info.txt und benutzerseitige Protokolldateien im Logs-Ordner schreiben.\n\nLass dies aktiviert, wenn du Support-Protokolle sammelst.
ShowLogOutput=Protokollausgabe in der Plattform-Protokollkonsole/im Fenster anzeigen, falls verfügbar.
ForceLogFlush=Protokollschreibvorgänge sofort ausführen.\n\nAktiviere dies beim Reproduzieren von Abstürzen oder harten Einfrierungen, auf Kosten zusätzlicher Festplatten-I/O.
LogSkips=Frame-Skip-Timing-Protokolle schreiben.\n\nVerwende dies, wenn das Gameplay sichtbar ruckelt oder das Timing instabil wirkt.
LogCheckpoints=Engine-Checkpoint-Protokolle schreiben.\n\nVerwende dies bei Problemen mit Start, Bildschirmwechsel oder Beenden.
PerfDiagnostics=Hauptschalter: aktiviert jede unten aufgeführte Diagnosekategorie und schreibt außerdem detaillierte PERF_TRACE-Einträge für Frame-Pacing, Gameplay-Zeichenkosten und langsame Engine-Phasen.\n\nVerwende dies, um bei einem Bericht alles auf einmal zu erfassen; aktiviere stattdessen eine einzelne Kategorie unten für ruhigere, gezielte Protokolle.
LogAudioUnderrunDiagnostics=Detaillierte UNDERRUN_TRACE-Einträge für Audio-Starvation und Decode-Stockungen schreiben.\n\nVerwende dies, wenn Audio aussetzt, knackt oder asynchron wird.
LogTextureUploadDiagnostics=OpenGL-Textur-Upload-Details schreiben.\n\nVerwende dies, wenn Grafiken fehlen, beschädigt sind oder beim Laden von Texturen ruckeln.
LogResourceSnapshotDiagnostics=Textur-/Ressourcen-Snapshots bei Bildschirmwechseln schreiben.\n\nVerwende dies, um Speicherwachstum oder vermutete Texturlecks zu verfolgen.
LogBackgroundDiagnostics=BGA_TRACE-Einträge für Song-Hintergründe, BGChanges, Hintergrundvideos und langsame Hintergrund-Ladevorgänge schreiben.\n\nVerwende dies, wenn ein Hintergrundvideo einfriert, ruckelt oder falsch angezeigt wird.
LogPlayOnceDiagnostics=Soundeffekt-Cache-Statistiken schreiben und manuelle PlayOnce-Diagnose aus Lua erlauben.\n\nVerwende dies, wenn kurze Soundeffekte fehlen, verzögert sind oder der Speicherverbrauch wächst.
LogNoteSkinDiagnostics=NoteSkin-Actor-Cache-Statistiken schreiben.\n\nVerwende dies, wenn NoteSkins langsam laden, falsch aussehen oder Speicher zu lecken scheinen.
LogInputDiagnostics=Entprellte Eingabeereignisse nach der Geräte-zu-Spiel-Zuordnung schreiben.\n\nVerwende dies, wenn Pads, Tasten, Münzen oder Menüeingaben fehlen, doppelt sind oder falsch zugeordnet werden.
LogMemoryCardDiagnostics=Zuweisungs-, Mount- und Unmount-Traces für USB-Profile und Speicherkarten schreiben.\n\nVerwende dies, wenn USB-Profile nicht erkannt, der falschen Seite zugewiesen werden oder beim Speichern/Laden fehlschlagen.
LogContentLoadDiagnostics=Lade-Traces für Songs, Kurse, Notes, Lyrics und Audio-Reader schreiben.\n\nVerwende dies, wenn Inhalte langsam laden, fehlen, abgelehnt werden oder nur bei bestimmten Packs fehlschlagen.
LogThemeLuaDiagnostics=Lade-Traces für Theme-Lua-Skripte schreiben.\n\nVerwende dies, wenn das Theme beim Start, beim Neuladen oder beim Bildschirmwechsel fehlschlägt.
LogGlobalOffsetDiagnostics=Schreibt detaillierte Traces für benannte Global-Offset-Profile, Optionszeilen, Kalibrierung, Autosync und Timing-Konvertierungen.\n\nNur beim Debuggen des Audio-Offsets aktivieren.
LogWindowsEventDiagnostics=Schreibt native Win32-Fenstermeldungen.\n\nNur zur Diagnose von Fokus-, Größen- oder Eingabeproblemen unter Windows aktivieren; dies kann Tausende Zeilen erzeugen.
runtime_validation=Schreibt gezielte Laufzeitdiagnosen für gehärtete Codepfade.\n\nNur zur Untersuchung eines bestimmten Problems aktivieren.
GlobalOffsetProfile=Wählt aus, welches benannte Audio-Offset-Profil aktiv ist. Jedes Profil zeigt seinen aktuellen Offset-Wert an.\n\nDrücke Start auf dieser Zeile, um das aktive Profil umzubenennen.
RenameGlobalOffsetProfile=Wählt ein Audio-Offset-Profil zum Umbenennen aus.
GlobalOffsetSeconds=Stellt den Audio-Offset des aktiven Profils in Millisekunden ein.\n\nNegative Werte spielen Audio früher ab, positive Werte spielen Audio später ab.
EnableArrowCloud=Aktiviert das Drittanbieter-Arrow Cloud-Score-Modul.\n\nWenn aktiviert, kann das Theme ein Arrow Cloud-Konto verknüpfen, berechtigte Scores nach dem Song übermitteln und mit api.arrowcloud.dance kommunizieren.
ArrowCloudDebugLogs=Detaillierte Arrow Cloud-Traces für Anfragen, Login und Bestenliste in log.txt schreiben.\n\nDeaktiviert lassen, außer beim Debuggen von Konto-/Verknüpfungs-/Scoreboard-Problemen.
MusicWheelGS=Wähle, wie GrooveStats / ArrowCloud-Scores im Songauswahl-Bildschirm angezeigt werden.\n\nScorebox zeigt eine kleine Bestenliste. Pane verwendet die untere Song-Anzeige, falls verfügbar. Aus blendet diese Anzeige aus.
HideGrooveStats=GrooveStats-Bestenlisten aus der Scorebox-Rotation ausblenden.\n\nArrowCloud-Bestenlisten werden weiterhin angezeigt.
ExScoreMode=Wähle den während des Gameplays angezeigten EX-Score-Modus. EX und H.EX schließen sich gegenseitig aus.
ShowAllScoreModes=Show lower score modes next to the main gameplay score.
MatchFantasticColor=Färbt Fantastic-Wertungen entsprechend dem aktiven Präzisionsfenster des gewählten Score-Modus.
ResetLogs=Löscht den gesamten Inhalt von log.txt, damit die Protokollierung mit einer sauberen Basis beginnt.\n\nWähle Jetzt zurücksetzen und verlasse diesen Bildschirm, um es anzuwenden.

DefaultSort=Set the default sort order for songs in the MusicWheel.\nBy default, this is set to "Series" which groups songs into Series and Groups.
HideInactiveSeries=Set this to 'Yes' if you want the MusicWheel to hide other, inactive series when actively browsing one.
PreferredStyle=Set this if you ALWAYS play a certain style and want to get to gameplay as fast as possible.\n\nSet this to "None" if you want to choose a style like "1 Player" or "2 Players" for each new game cycle.
