LogOptions=Activa registros de soporte para diagnósticos de rendimiento, renderizado, audio y caché.
ShowPopups=Elige si los diálogos del motor pueden aparecer, o si solo se escriben en los registros. Usa solo registros en cabinas arcade para evitar salir de pantalla completa.
ArrowCloudOptions=Gestiona los ajustes de integración de Arrow Cloud.
OnlineOptions=Gestiona los ajustes del modo online ITG.
OnlineTokenPersistence=Choose whether this local profile should always show the QR login screen, or keep its ITG Online sign-in token for later sessions.
ITGOnlineGameplayLayoutLogs=Enable verbose logs for online gameplay layout calculations, including columns, panel widths, and leaderboard size. Leave this disabled unless you are debugging screen layout.
ITGOnlineNetworkLogs=Activa diagnósticos limitados del protocolo, salas, tiempo real y sincronización de paquetes. Los datos sensibles se ocultan.
ITGOnlineAuthLogs=Activa diagnósticos limitados del inicio de sesión y las credenciales. Los tokens nunca se registran.
ITGOnlineScoreLogs=Activa diagnósticos limitados de puntuación en vivo, fallos y evaluación.
DissociateOnlineAccount=Desvincula el perfil local seleccionado de su cuenta ITG Online. Se revoca el token guardado y el jugador tendra que escanear un codigo QR de nuevo.
SoundDriver=Elige el backend de audio de Windows. Se recomienda WASAPI primero; DirectSound-sw, WaveOut y WDMKS están disponibles por compatibilidad.\n\nDeberás reiniciar SM5 si cambias esto para que surta efecto.
LogToDisk=Escribe Log.txt, info.txt y archivos de registro para el usuario en la carpeta Logs.\n\nManténlo activado cuando recopiles registros de soporte.
ShowLogOutput=Muestra la salida del registro en la consola/ventana de registro de la plataforma cuando esté disponible.
ForceLogFlush=Vuelca las escrituras del registro inmediatamente.\n\nActívalo al reproducir cierres inesperados o bloqueos totales, a costa de E/S de disco adicional.
LogSkips=Escribe registros de tiempo de saltos de cuadro.\n\nÚsalo cuando el juego se entrecorte visiblemente o la sincronización se sienta inestable.
LogCheckpoints=Escribe registros de puntos de control del motor.\n\nÚsalo para problemas de inicio, transición de pantalla o cierre.
PerfDiagnostics=Interruptor maestro: activa todas las categorías de diagnóstico de abajo y también escribe entradas PERF_TRACE detalladas para el ritmo de fotogramas, el coste de dibujado del juego y las fases lentas del motor.\n\nÚsalo para capturarlo todo de una vez al reportar un problema; activa en su lugar una sola categoría de abajo para registros más concretos y silenciosos.
LogAudioUnderrunDiagnostics=Escribe entradas UNDERRUN_TRACE detalladas para inanición de audio y atascos de decodificación.\n\nÚsalo cuando el audio se corta, chasquea o se desincroniza.
LogTextureUploadDiagnostics=Escribe detalles de carga de texturas OpenGL.\n\nÚsalo cuando faltan gráficos, están corruptos o se entrecortan al cargar texturas.
LogResourceSnapshotDiagnostics=Escribe instantáneas de texturas/recursos en las transiciones de pantalla.\n\nÚsalo para rastrear el crecimiento de memoria o sospechas de fugas de texturas.
LogBackgroundDiagnostics=Escribe entradas BGA_TRACE para fondos de canción, BGChanges, vídeos de fondo y cargas lentas de fondos.\n\nÚsalo cuando un vídeo de fondo se congela, se entrecorta o se muestra mal.
LogPlayOnceDiagnostics=Escribe estadísticas de caché de efectos de sonido y permite diagnósticos PlayOnce manuales desde Lua.\n\nÚsalo cuando faltan efectos de sonido cortos, llegan tarde o crece el uso de memoria.
LogNoteSkinDiagnostics=Escribe estadísticas de caché de actores de NoteSkin.\n\nÚsalo cuando los noteskins cargan lento, se ven mal o parecen tener fugas de memoria.
LogInputDiagnostics=Escribe eventos de entrada tras el antirrebote y el mapeo de dispositivo a juego.\n\nÚsalo cuando los pads, botones, monedas o entradas de menú faltan, se duplican o se mapean mal.
LogMemoryCardDiagnostics=Escribe trazas de asignación, montaje y desmontaje de perfiles USB y tarjetas de memoria.\n\nÚsalo cuando los perfiles USB no se detectan, se asignan al lado incorrecto o fallan al guardar/cargar.
LogContentLoadDiagnostics=Escribe trazas de carga de canciones, cursos, notas, letras y lectores de audio.\n\nÚsalo cuando el contenido carga lento, falta, es rechazado o solo falla en packs específicos.
LogThemeLuaDiagnostics=Escribe trazas de carga de scripts Lua del tema.\n\nÚsalo cuando el tema falla durante el inicio, la recarga o la transición de pantalla.
LogGlobalOffsetDiagnostics=Escribe trazas detalladas de perfiles de offset global, filas de opciones, calibración, autosync y conversiones de timing.\n\nActívalo solo para depurar el offset de audio.
LogWindowsEventDiagnostics=Escribe mensajes nativos de ventana Win32.\n\nActívalo solo para diagnosticar problemas de foco, tamaño o entrada en Windows; puede generar miles de líneas.
runtime_validation=Escribe diagnósticos específicos para rutas de código reforzadas.\n\nDéjalo desactivado salvo para investigar un problema concreto.
EnableArrowCloud=Activa el módulo de puntuación de terceros Arrow Cloud.\n\nCuando está activado, el tema puede vincular una cuenta de Arrow Cloud, enviar puntuaciones elegibles tras la canción y comunicarse con api.arrowcloud.dance.
ArrowCloudDebugLogs=Escribe trazas detalladas de Arrow Cloud para solicitudes, inicio de sesión y clasificación en log.txt.\n\nDéjalo desactivado salvo que estés depurando problemas de cuenta/vínculo/tabla de puntuaciones.
MusicWheelGS=Selecciona cómo mostrar las puntuaciones de GrooveStats / ArrowCloud en la pantalla de selección de canciones.\n\nScorebox muestra una pequeña clasificación. Pane usa el panel inferior de la canción cuando está disponible. Off oculta esta visualización.
HideGrooveStats=Oculta las clasificaciones de GrooveStats de la rotación del scorebox.\n\nLas clasificaciones de ArrowCloud seguirán mostrándose.
ExScoreMode=Elige el modo de puntuación EX mostrado durante el juego. EX y H.EX son mutuamente exclusivos.
ShowAllScoreModes=Show lower score modes next to the main gameplay score.
MatchFantasticColor=Colorea los Fantastic según la ventana de precisión activa del modo de puntuación elegido.
ResetLogs=Borra todo el contenido de log.txt para empezar desde una base limpia.\n\nSelecciona Restablecer ahora y sal de esta pantalla para aplicar.

DefaultSort=Set the default sort order for songs in the MusicWheel.\nBy default, this is set to "Series" which groups songs into Series and Groups.
HideInactiveSeries=Coloca esto a 'No' si quieres que otras series/grupos sigan siendo visibles cuando ya tienes una serie expandida.
PreferredStyle=Deja esto en "Ninguno" si quieres escoger algún estilo como "1 Jugador" o "2 Jugadores" para cada nueva partida.
